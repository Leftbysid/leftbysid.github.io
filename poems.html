<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Poems</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="poems.css"/>
</head>
<body>

<!-- AUTH GUARD -->
<script type="module">
import { auth } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

onAuthStateChanged(auth, user => {
  if (!user) window.location.href = "index.html";
});
</script>

<div class="page">

  <!-- TOP RIGHT -->
  <div class="top-actions">
    <a href="dashboard.html" class="action-btn">⬅ Back</a>
  </div>

  <!-- HEADER -->
  <header class="header">
    <h1 class="title">POEMS</h1>

    <p class="total" id="totalPoems">Total: 0</p>

    <div class="controls">
      <input id="searchInput" class="search" type="text" placeholder="Search poems..." />
      <button id="sortBtn" class="filter-btn">🕒 Recently Added</button>
    </div>

    <button class="add-btn" id="openAddOverlay">＋ Add Poem</button>
  </header>

  <!-- LIST -->
  <main class="list" id="poemsList">
    <p class="muted">Loading...</p>
  </main>

</div>

<!-- =========================
     ADD POEM
========================= -->
<div class="overlay hidden" id="addOverlay">
  <div class="overlay-box">

    <div class="overlay-head">
      <h2>ADD POEM</h2>
      <button class="close-btn" id="closeAddOverlay">✖</button>
    </div>

    <textarea id="poemContent" class="textarea" placeholder="Write your poem..."></textarea>

    <input id="poemTitle" class="input" placeholder="Title"/>
    <input id="poemAuthor" class="input" placeholder="Author"/>
    <input id="poemLanguage" class="input" placeholder="Language"/>
    <input id="poemYear" class="input" placeholder="Year"/>

    <button class="btn" id="addPoemBtn">SAVE POEM</button>
    <p class="status" id="statusText"></p>

  </div>
</div>

<!-- =========================
     EDIT POEM (FIXED)
========================= -->
<div class="overlay hidden" id="poemOverlay">
  <div class="overlay-box">

    <div class="overlay-head">
      <input id="overlayTitle" class="input" placeholder="Title"/>
      <button class="close-btn" id="closeOverlay">✖</button>
    </div>

    <textarea id="overlayContent" class="textarea"></textarea>

    <!-- ✅ ADDED MISSING FIELDS -->
    <input id="overlayAuthor" class="input" placeholder="Author"/>
    <input id="overlayLanguage" class="input" placeholder="Language"/>
    <input id="overlayYear" class="input" placeholder="Year"/>

    <p id="overlayMeta" class="poem-meta"></p>

    <div class="overlay-actions">
      <button id="saveEditBtn" class="btn">SAVE CHANGES</button>
      <button id="deleteBtn" class="btn danger">DELETE</button>
    </div>

  </div>
</div>

<!-- =========================
     FULL SCREEN READING MODE
========================= -->
<div class="focus-overlay hidden" id="focusOverlay">
  <div class="focus-content">
    <h1 class="focus-title" id="focusTitle"></h1>
    <div class="focus-text" id="focusText"></div>
    <div class="focus-meta" id="focusMeta"></div>
  </div>
</div>

<script type="module" src="poems.js"></script>

</body>
</html>
