<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes</title>

  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="notes.css" />
</head>
<body>

<!-- AUTH GUARD -->
<script type="module">
import { auth } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

onAuthStateChanged(auth, user => {
  if (!user) window.location.href = "index.html";
});
</script>

<div class="page">

  <!-- TOP RIGHT BUTTONS -->
  <div class="top-actions">
    <a href="dashboard.html" class="action-btn">⬅ Back</a>
  </div>

  <!-- HEADER CENTER -->
  <header class="header">
    <div class="title-row">
      <span class="title-icon">🗒️</span>
      <h1 class="title">NOTES VAULT</h1>
    </div>

    <p class="total" id="totalNotes">Total: 0</p>

    <!-- CONTROLS -->
    <div class="controls">
      <input id="searchInput" class="search" type="text" placeholder="Search notes..." />
      <button id="sortBtn" class="filter-btn">🕒 Recently Added</button>
    </div>

    <button class="add-btn" id="openAddOverlay">＋ Add Note</button>
  </header>

  <!-- LIST -->
  <main class="list" id="notesList">
    <p class="muted">Loading...</p>
  </main>

</div>

<!-- ADD NOTE OVERLAY -->
<div class="overlay hidden" id="addOverlay">
  <div class="overlay-box">

    <div class="overlay-head">
      <h2 class="overlay-title">ADD NOTE</h2>
      <button class="close-btn" id="closeAddOverlay">✖</button>
    </div>

    <input id="noteTitle" class="input" type="text" placeholder="Title (optional)" />

    <!-- ✅ OPTIONAL DATE -->
    <input id="noteDate" class="input" type="date" />

    <textarea id="noteBody" class="textarea" placeholder="Write your note..."></textarea>

    <button class="btn" id="addNoteBtn">SAVE NOTE</button>
    <p class="status" id="statusText"></p>

  </div>
</div>

<!-- VIEW/EDIT OVERLAY -->
<div class="overlay hidden" id="noteOverlay">
  <div class="overlay-box">

    <div class="overlay-head">
      <h2 class="overlay-title">EDIT NOTE</h2>
      <button class="close-btn" id="closeOverlay">✖</button>
    </div>

    <input id="editTitle" class="input" type="text" placeholder="Title" />
    <input id="editDate" class="input" type="date" />
    <textarea id="editBody" class="textarea" placeholder="Note..."></textarea>

    <div class="overlay-actions">
      <button class="btn" id="saveEditBtn">SAVE CHANGES</button>
      <button class="btn danger" id="deleteBtn">DELETE</button>
    </div>

    <p class="overlay-meta" id="overlayMeta"></p>

  </div>
</div>

<script type="module" src="notes.js"></script>
</body>
</html>
